# NOT the supported way to run this project.
#
# The supported path is one process plus one dev server, on SQLite:
#   .venv/Scripts/python.exe -m uvicorn backend.app.main:app --reload --port 8001
#   cd frontend && npm run dev
#
# This file is kept only so an existing `docker compose up` does not silently
# start a Postgres the application no longer uses. It requires
# backend/Dockerfile and frontend/Dockerfile, which are deliberately not in
# this repo (modular monolith, no container ceremony -- ARCHITECTURE A.5).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/dwi.db
      DATABASE_URL_SYNC: sqlite:////data/dwi.db
      ENVIRONMENT: development
    volumes:
      - ./backend:/app/backend
      - dwidata:/data
    command: >
      sh -c "cd /app &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8001 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      API_REWRITE_URL: http://api:8001
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src

volumes:
  dwidata:
