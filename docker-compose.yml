# Local container run. The supported *development* path is still one process
# plus one dev server on SQLite:
#
#   .venv/Scripts/python.exe -m uvicorn backend.app.main:app --reload --port 8001
#   cd frontend && npm run dev
#
# This file exists so the deployment artifacts are exercised locally before
# they are exercised in production.
#
#   docker compose up --build                 # SQLite on a named volume
#   docker compose --profile postgres up -d db # a Postgres to point at
#
# To run the API against that Postgres:
#
#   DATABASE_URL=postgresql+asyncpg://dwi:dwi@db:5432/dwi docker compose up --build
#
# Nothing else changes - Postgres support is configuration, not code (9.2).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/dwi.db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-sqlite:////data/dwi.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Empty means POST /admin/reset-seed is disabled, which is the right
      # default even locally - set it when you want the reset button.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Optional. Absent selects the offline path, under which everything
      # still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The backend half of the identity handshake. Must be byte-identical to
      # the frontend's. Empty keeps the pre-auth open behaviour: X-User-Id is
      # trusted as sent and roles stay advisory.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    volumes:
      - dwidata:/data
    healthcheck:
      # /health, not /ready: this decides whether to restart the container,
      # and restarting because the database blipped turns a recoverable
      # outage into a crash loop.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No build args. The browser talks only to this origin, and the
      # backend URL is a runtime setting (API_REWRITE_URL) below.
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Read at runtime by src/proxy.ts and by the sign-in upsert, inside the
      # container, where the backend answers to a service name.
      API_REWRITE_URL: ${API_REWRITE_URL:-http://api:8001}
      # Auth.js. Without the first three, sign-in fails closed and the app is
      # unusable - which is the correct failure for a misconfigured login.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # The frontend half of the handshake. Must equal the api service's.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    depends_on:
      api:
        condition: service_healthy

  # Not started by default: the default path is SQLite and needs nothing.
  # `docker compose --profile postgres up -d db` when you want to exercise
  # the Postgres path locally.
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dwi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwi}
      POSTGRES_DB: ${POSTGRES_DB:-dwi}
    ports:
      - "5433:5432"
    volumes:
      - dwipg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwi}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dwidata:
  dwipg:
