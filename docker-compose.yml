version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dwi
      POSTGRES_PASSWORD: dwi_dev_password
      POSTGRES_DB: dwi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dwi:dwi_dev_password@db:5432/dwi
      DATABASE_URL_SYNC: postgresql://dwi:dwi_dev_password@db:5432/dwi
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./engine.py:/app/engine.py
    command: >
      sh -c "cd /app && alembic -c backend/alembic.ini upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Client-side (browser) hits the host-mapped port
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side rewrites use Docker service name
      API_REWRITE_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
