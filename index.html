<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow Intelligence</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --tx:#e6edf3; --dim:#8b98a5; --acc:#4c9aff; --red:#f85149;
    --amber:#e3b341; --green:#3fb950; --violet:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12px}
  .kpis{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
  .kpi{text-align:right}
  .kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  nav{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  nav button{background:none;border:0;color:var(--dim);padding:11px 16px;cursor:pointer;
             font-size:13px;border-bottom:2px solid transparent}
  nav button.on{color:var(--tx);border-bottom-color:var(--acc)}
  main{padding:22px;max-width:1400px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>.card{flex:1;min-width:300px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
     margin:0 0 12px}
  .bn{border-left:3px solid var(--line);padding:12px 14px;margin-bottom:10px;
      background:var(--panel2);border-radius:0 6px 6px 0}
  .bn.high{border-left-color:var(--red)} .bn.medium{border-left-color:var(--amber)}
  .bn-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .bn-h strong{font-size:13px;letter-spacing:.3px}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;background:#26303c;color:var(--dim)}
  .pill.red{background:#3d1d1d;color:#ff9b95} .pill.amb{background:#3a3216;color:#e8c96a}
  .bn dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:10px 0 0;font-size:12.5px}
  .bn dt{color:var(--dim)} .bn dd{margin:0}
  code{background:#0b0e13;padding:1px 5px;border-radius:3px;font-size:12px;color:#9ecbff}
  .act{margin-top:10px;padding:8px 10px;background:#11202f;border-radius:5px;
       font-size:12.5px;color:#a8d0ff}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;
     border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td{padding:6px 8px;border-bottom:1px solid #1e252e}
  tr:last-child td{border-bottom:0}
  .crit{color:var(--red)}
  .mono{font-variant-numeric:tabular-nums}
  button.go{background:var(--acc);color:#04101f;border:0;padding:8px 14px;border-radius:6px;
            cursor:pointer;font-size:13px;font-weight:600}
  button.go.alt{background:var(--violet);color:#150a24}
  select,input{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
               padding:7px 9px;border-radius:6px;font-size:13px}
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .delta{font-weight:600} .delta.bad{color:var(--red)} .delta.ok{color:var(--green)}
  .swim{overflow-x:auto}
  .lane{font-size:11px;fill:var(--dim)}
  .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;
       background:#26303c;color:var(--dim);margin-left:6px}
  .redo{background:#3d1d1d;color:#ff9b95} .rechk{background:#3a3216;color:#e8c96a}
</style>
</head>
<body>
<header>
  <div>
    <h1>Workflow Intelligence <span class="sub">— MVP</span></h1>
    <div class="sub" id="scen">loading…</div>
  </div>
  <div class="kpis">
    <div class="kpi"><b id="k1">–</b><span>planned finish</span></div>
    <div class="kpi"><b id="k2">–</b><span>projected finish</span></div>
    <div class="kpi"><b id="k3" class="crit">–</b><span>slip</span></div>
    <div class="kpi"><b id="k4">–</b><span>open bottlenecks</span></div>
  </div>
</header>

<nav>
  <button class="on" data-v="inbox">Bottleneck inbox</button>
  <button data-v="sim">Change simulator</button>
  <button data-v="graph">Dependency map</button>
  <button data-v="acc">Accuracy</button>
</nav>

<main>
  <section id="v-inbox"></section>
  <section id="v-sim" hidden></section>
  <section id="v-graph" hidden></section>
  <section id="v-acc" hidden></section>
</main>

<script>
const $ = s => document.querySelector(s);
let S = null;

const fmtd = n => (n>0?'+':'') + n + 'd';
const kindName = k => k.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());

async function boot(){
  S = await (await fetch('/api/state')).json();
  $('#scen').textContent =
    `Campus tech symposium · ${S.tasks.length} tasks · `
    + `${Object.keys(S.departments).length} departments · day ${S.today_day} of the project`;
  $('#k1').textContent = S.planned_end_date;
  $('#k2').textContent = S.projected_end_date;
  $('#k3').textContent = fmtd(S.slip_days);
  $('#k4').textContent = S.bottlenecks.length;
  renderInbox(); renderSim(); renderGraph(); renderAcc();
}

/* ---------------------------------------------------------------- inbox */
function renderInbox(){
  const bn = S.bottlenecks.map(b => `
    <div class="bn ${b.severity}">
      <div class="bn-h">
        <strong>${kindName(b.kind)}</strong>
        <span class="pill ${b.severity==='high'?'red':'amb'}">${b.severity}</span>
        <span class="pill">${b.attributed_delay_days}d lost</span>
        <span class="pill">impact ${b.impact_score}</span>
        <span class="pill">${b.downstream_affected.length} downstream</span>
      </div>
      <dl>
        <dt>Tasks</dt><dd>${b.tasks.map(t=>`<code>${t}</code>`).join(' ')}</dd>
        <dt>Root cause</dt><dd><code>${b.root_cause}</code></dd>
        <dt>Evidence</dt><dd>${Object.entries(b.evidence)
            .map(([k,v])=>`${k.replace(/_/g,' ')}: <b>${Array.isArray(v)?v.join(', '):v}</b>`)
            .join(' · ')}</dd>
        <dt>Blocked work</dt><dd>${b.downstream_affected.map(t=>`<code>${t}</code>`).join(' ')||'—'}</dd>
      </dl>
      <div class="act">→ ${b.suggested_action}</div>
    </div>`).join('');

  const rows = S.tasks.map(t => `
    <tr>
      <td><code>${t.id}</code></td><td>${t.name}</td><td>${t.dept}</td>
      <td>${t.owner}</td><td>${t.status.replace(/_/g,' ')}</td>
      <td class="mono">${t.start_date}</td>
      <td class="mono ${t.critical?'crit':''}">${t.critical?'0 (critical)':t.slack+'d'}</td>
    </tr>`).join('');

  $('#v-inbox').innerHTML = `
    <div class="card">
      <h2>Bottlenecks — ranked by impact (days lost × work stuck behind it)</h2>
      ${bn}
      <div class="note">Impact score = attributed delay × (1 + downstream tasks). It is a
        formula, not a model — every number above is recomputable by hand from the
        event log. Two detectors firing on <code>T03</code> is agreement, not duplication:
        one found it on the critical path, one found it idle in review.</div>
    </div>
    <div class="card">
      <h2>Critical path — ${S.critical_path.join(' → ')}</h2>
      <table><thead><tr><th>id</th><th>task</th><th>dept</th><th>owner</th>
        <th>status</th><th>starts</th><th>slack</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>`;
}

/* ------------------------------------------------------------ simulator */
function renderSim(){
  const opts = S.tasks.map(t=>`<option value="${t.id}">${t.id} — ${t.name}</option>`).join('');
  const reqs = Object.entries(S.requirements)
      .map(([k,v])=>`<option value="${k}">${k} — ${v.text}</option>`).join('');
  $('#v-sim').innerHTML = `
    <div class="row">
      <div class="card">
        <h2>A · What if a task slips?</h2>
        <div class="ctl">
          <select id="dtask">${opts}</select>
          <input id="ddays" type="number" value="5" min="1" max="30" style="width:70px">
          <span class="sub">days</span>
          <button class="go" onclick="runDelay()">Propagate</button>
        </div>
        <div id="dout"></div>
      </div>
      <div class="card">
        <h2>B · What if a requirement changes?</h2>
        <div class="ctl">
          <select id="rq">${reqs}</select>
          <button class="go alt" onclick="runReq()">Propagate</button>
        </div>
        <div id="rout"></div>
        <div class="note">This is the half a task board cannot do. A board tracks
          <i>dates</i>; a changed spec invalidates <i>finished work</i>, and only a
          model that knows which task consumed which artifact can tell you which.</div>
      </div>
    </div>`;
  document.getElementById('dtask').value = 'T03';
  runDelay(); runReq();
}

async function runDelay(){
  const body = {task_id:$('#dtask').value, extra_days:+$('#ddays').value};
  const d = await (await fetch('/api/simulate/delay',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  const rows = d.moved_detail.map(m=>`
    <tr><td><code>${m.id}</code></td><td>${m.name}</td><td>${m.dept}</td>
        <td>${m.owner}</td>
        <td class="mono">${m.from_date} → <b>${m.to_date}</b></td>
        <td class="mono crit">${fmtd(m.delta)}</td></tr>`).join('');
  $('#dout').innerHTML = `
    <div class="bn ${d.project_end_delta>0?'high':'medium'}">
      <div class="bn-h">
        <strong>Project finish ${d.end_date_before} → ${d.end_date_after}</strong>
        <span class="delta ${d.project_end_delta>0?'bad':'ok'}">${fmtd(d.project_end_delta)}</span>
      </div>
      <dl>
        <dt>Tasks moved</dt><dd>${d.moved_detail.length}</dd>
        <dt>Critical path</dt><dd>${d.critical_path_changed
            ? 'CHANGED — newly critical: '+(d.newly_critical.join(', ')||'—')
            : 'unchanged'}</dd>
        <dt>Notify</dt><dd><b>${d.notify.join(', ')||'—'}</b></dd>
      </dl>
    </div>
    ${rows?`<table><thead><tr><th>id</th><th>task</th><th>dept</th><th>owner</th>
      <th>start moves</th><th>Δ</th></tr></thead><tbody>${rows}</tbody></table>`
      :'<div class="note">Absorbed entirely by slack — nothing downstream moves.</div>'}`;
}

async function runReq(){
  const r = await (await fetch('/api/simulate/requirement',
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({req_id:$('#rq').value})})).json();
  const li = (arr,cls) => arr.map(t=>`
    <tr><td><code>${t.id}</code></td><td>${t.name}<span class="tag ${cls}">${
      cls==='redo'?'must redo':'re-check'}</span></td>
      <td>${t.dept}</td><td>${t.owner}</td><td>${t.status.replace(/_/g,' ')}</td></tr>`).join('');
  $('#rout').innerHTML = `
    <div class="bn high">
      <div class="bn-h">
        <strong>${r.req_id} v${r.from_version} → v${r.to_version}</strong>
        <span class="pill red">${r.must_redo.length} must redo</span>
        <span class="pill amb">${r.must_recheck.length} re-check</span>
        <span class="pill">${r.departments_hit.length} departments</span>
        ${r.wasted_days?`<span class="pill red">${r.wasted_days}d of completed work invalidated</span>`:''}
      </div>
      <dl>
        <dt>Was</dt><dd>${r.text}</dd>
        <dt>Consumed by</dt><dd>${r.directly_consumed_by.map(t=>`<code>${t}</code>`).join(' ')}</dd>
        <dt>Departments</dt><dd><b>${r.departments_hit.join(', ')}</b></dd>
      </dl>
    </div>
    <table><thead><tr><th>id</th><th>task</th><th>dept</th><th>owner</th><th>status</th>
      </tr></thead><tbody>${li(r.must_redo,'redo')}${li(r.must_recheck,'rechk')}</tbody></table>`;
}

/* ---------------------------------------------------------------- graph */
function renderGraph(){
  const depts = Object.keys(S.departments);
  const LANE=74, PAD=120, DAY=26, H=depts.length*LANE+56;
  const maxd = Math.max(...S.tasks.map(t=>t.ef));
  const W = PAD + (maxd+2)*DAY;
  const pos = {};
  S.tasks.forEach(t=>{
    const lane = depts.indexOf(t.dept);
    pos[t.id] = {x: PAD + t.es*DAY, y: 40 + lane*LANE + 16,
                 w: Math.max(t.ef-t.es,1)*DAY - 4};
  });
  const lanes = depts.map((d,i)=>`
    <rect x="0" y="${34+i*LANE}" width="${W}" height="${LANE-4}"
          fill="${i%2?'#141a21':'#11161c'}"/>
    <text class="lane" x="10" y="${34+i*LANE+22}">${d} · cap ${S.departments[d]}</text>`).join('');
  const edges = S.edges.map(e=>{
    const a=pos[e.from], b=pos[e.to];
    const x1=a.x+a.w, y1=a.y+13, x2=b.x, y2=b.y+13;
    const mx=(x1+x2)/2;
    const hard = e.kind==='artifact';
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
      fill="none" stroke="${hard?'#3d4a5a':'#2a323d'}" stroke-width="1.4"
      ${hard?'':'stroke-dasharray="3,3"'}/>`;
  }).join('');
  const boxes = S.tasks.map(t=>{
    const p=pos[t.id];
    const fill = t.status==='done' ? '#1b2b1f'
               : t.status==='in_review' ? '#3a2016'
               : t.critical ? '#2a1a1e' : '#1c232c';
    const stroke = t.critical ? '#f85149' : t.status==='done' ? '#3fb950' : '#39424f';
    return `<g>
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="27" rx="5"
            fill="${fill}" stroke="${stroke}" stroke-width="${t.critical?1.6:1}"/>
      <text x="${p.x+7}" y="${p.y+18}" font-size="11" fill="#e6edf3">${t.id}</text>
      <title>${t.id} — ${t.name}
${t.dept} · ${t.owner} · ${t.status}
${t.start_date} → ${t.end_date} · slack ${t.slack}d</title>
    </g>`;
  }).join('');
  const ticks = Array.from({length:Math.ceil(maxd/5)+1},(_,i)=>i*5).map(dd=>`
    <line x1="${PAD+dd*DAY}" y1="28" x2="${PAD+dd*DAY}" y2="${H-8}"
          stroke="#1e252e"/>
    <text class="lane" x="${PAD+dd*DAY+3}" y="22">d${dd}</text>`).join('');
  const todayX = PAD + S.today_day*DAY;

  $('#v-graph').innerHTML = `
    <div class="card">
      <h2>Dependency map — departments as lanes, time along the x-axis</h2>
      <div class="swim">
        <svg width="${W}" height="${H}" style="min-width:100%">
          ${lanes}${ticks}
          <line x1="${todayX}" y1="28" x2="${todayX}" y2="${H-8}"
                stroke="#4c9aff" stroke-width="1.5" stroke-dasharray="4,3"/>
          <text class="lane" x="${todayX+4}" y="${H-12}" fill="#4c9aff">today</text>
          ${edges}${boxes}
        </svg>
      </div>
      <div class="note">
        Red outline = zero slack (critical path). Green = done. Amber = in review.
        Solid edges are <b>artifact</b> dependencies (the successor consumes something the
        predecessor produces — these carry requirement staleness); dashed edges are
        <b>temporal</b> ordering only. Hover any box for dates and slack.
      </div>
    </div>`;
}

/* ------------------------------------------------------------- accuracy */
async function renderAcc(){
  const a = await (await fetch('/api/accuracy')).json();
  const rows = Object.entries(S.ground_truth).map(([k,v])=>`
    <tr><td><code>${k}</code></td><td>${v}</td>
    <td>${a.true_positives.includes(k)
        ?'<span class="pill amb" style="background:#153;color:#7ee787">detected</span>'
        :'<span class="pill red">missed</span>'}</td></tr>`).join('');
  $('#v-acc').innerHTML = `
    <div class="card">
      <h2>Detector accuracy against planted ground truth</h2>
      <table><thead><tr><th>fault</th><th>what we planted</th><th>result</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="bn medium" style="margin-top:14px">
        <div class="bn-h">
          <strong>recall ${(a.recall*100).toFixed(0)}%</strong>
          <span class="pill">precision vs planted ${(a.precision_vs_planted*100).toFixed(0)}%</span>
          <span class="pill">${a.planted} planted · ${a.detected} detected · ${a.extra.length} extra</span>
        </div>
      </div>
      <div class="note">Detection accuracy is measured on <b>injected</b> faults, because
        that is the only place ground truth exists. Next step: run the same detectors over a
        real public event log (BPI Challenge) to show behaviour on data nobody authored.
        Saying which of your numbers are measured and which are demonstrated is the
        difference between evidence and a screenshot.</div>
    </div>`;
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['inbox','sim','graph','acc'].forEach(v=>$('#v-'+v).hidden = v!==b.dataset.v);
});
boot();
</script>
</body>
</html>
